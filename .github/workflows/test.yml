name: Tests

on:
  push:
    branches: [master, feature/waitlist-postgres-support]
  pull_request:
    branches: [master]

jobs:
  postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketbooking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketbooking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DIALECT: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ticketbooking
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:postgres
